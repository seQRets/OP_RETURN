<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OP_RETURN Builder tests</title>
<style>
  :root {
    /* the light palette from index.html */
    --bg: #f2ece0;
    --bg-grad: radial-gradient(1200px 600px at 50% -10%, #faf6ec 0%, #f2ece0 55%, #ece4d4 100%);
    --ink: #23201a;
    --ink-soft: #635d52;
    --ink-faint: #968f80;
    --panel: #fcf9f2;
    --panel-sunk: #f6f1e6;
    --line: #ded5c2;
    --line-soft: #eae2d3;
    --accent: #d2761a;
    --accent-ink: #a8590c;
    --accent-wash: #f7ecd9;
    --danger: #b8412a;
    --danger-wash: #f7e6e1;
    --ok: #4b8b3b;
    --ok-wash: #e9f0e2;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 2px rgba(20,24,28,.05), 0 6px 20px -8px rgba(20,24,28,.10);
    --shadow-lift: 0 1px 2px rgba(20,24,28,.06), 0 14px 34px -12px rgba(20,24,28,.20);
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --display: "Avenir Next", "Segoe UI", Roboto, "Helvetica Neue", -apple-system, sans-serif;
    color-scheme: light;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    background-image: var(--bg-grad);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding: 0 1.25rem 4rem;
  }
  .wrap { max-width: 820px; margin: 0 auto; }

  header { padding: 3.5rem 0 2rem; text-align: center; }
  h1 {
    font-family: var(--display);
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    margin-bottom: 0.9rem;
  }
  h1 .op { color: var(--accent); }
  .sub { color: var(--ink-soft); max-width: 62ch; margin: 0 auto; font-size: 0.98rem; }
  .sub code {
    font-family: var(--mono);
    font-size: 0.9em;
    background: var(--panel-sunk);
    border: 1px solid var(--line-soft);
    border-radius: 4px;
    padding: 0.05rem 0.3rem;
  }
  .back {
    display: inline-block;
    margin-top: 1.2rem;
    font-size: 0.86rem;
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 2px;
    text-decoration-color: var(--line);
  }
  .back:hover { color: var(--accent-ink); text-decoration-color: var(--accent); }

  #summary {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    font-size: 1.05rem;
    font-weight: 600;
    padding: 1.1rem 1.3rem;
    border-radius: var(--radius);
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-lift);
    margin-bottom: 2.25rem;
  }
  #summary::before {
    content: "";
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--ink-faint); flex: none;
  }
  #summary.pass { background: var(--ok-wash); border-color: color-mix(in srgb, var(--ok) 42%, transparent); color: #2f5c24; }
  #summary.pass::before { background: var(--ok); }
  #summary.fail { background: var(--danger-wash); border-color: color-mix(in srgb, var(--danger) 42%, transparent); color: #8e2f1e; }
  #summary.fail::before { background: var(--danger); }

  h2 {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 2rem 0 0.7rem;
  }
  h2:first-of-type { margin-top: 0; }

  .t {
    display: flex;
    gap: 0.85rem;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 0.7rem 0.95rem;
    margin-bottom: 0.4rem;
    font-size: 0.94rem;
  }
  .t .mark {
    flex: none;
    width: 24px; height: 24px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 0.95rem;
    font-weight: 700;
    line-height: 1;
    color: #fff;
  }
  .t.ok .mark { background: var(--ok); }
  .t.no .mark { background: var(--danger); }
  .t.no {
    background: var(--danger-wash);
    border-color: color-mix(in srgb, var(--danger) 38%, transparent);
  }
  .t .label { flex: 1; }
  .t .why {
    display: block;
    font-family: var(--mono);
    font-size: 0.84rem;
    color: var(--danger);
    margin-top: 0.2rem;
  }

  /* The page under test has to render to be measurable, so it is moved out of
     view rather than hidden. The size is fixed so no assertion depends on the
     window width or trips the builder's mobile breakpoint. */
  #app {
    position: absolute;
    left: -10000px;
    top: 0;
    width: 1024px;
    height: 900px;
    border: 0;
  }

  @media (max-width: 560px) {
    body { padding: 0 1rem 3rem; }
    header { padding: 2.5rem 0 1.5rem; }
    .t { font-size: 0.9rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="op">OP_RETURN</span> Builder tests</h1>
    <p class="sub">Drives the real <code>index.html</code> in a hidden frame and asserts against its actual DOM, so a regression in the shipped file fails here. Must be served over http, not opened from disk, or the frame cannot be read.</p>
    <a class="back" href="index.html">Back to the builder</a>
  </header>
  <div id="summary">running…</div>
  <div id="out"></div>
</div>
<iframe id="app" title="page under test" aria-hidden="true" tabindex="-1"></iframe>

<script>
(function () {
  var out = document.getElementById('out');
  var summary = document.getElementById('summary');
  var pass = 0, fail = 0;
  var doc, win;

  function group(name) {
    var h = document.createElement('h2');
    h.textContent = name;
    out.appendChild(h);
  }

  function is(label, actual, expected) {
    var ok = String(actual) === String(expected);
    record(ok, label, ok ? '' : 'got ' + JSON.stringify(actual) + ', wanted ' + JSON.stringify(expected));
  }

  function ok(label, cond, why) {
    record(!!cond, label, cond ? '' : (why || 'condition was false'));
  }

  function record(good, label, why) {
    good ? pass++ : fail++;
    var row = document.createElement('div');
    row.className = 't ' + (good ? 'ok' : 'no');
    row.innerHTML = '<span class="mark">' + (good ? '✓' : '✗') + '</span>' +
                    '<span class="label">' + label + (why ? '<span class="why">' + why + '</span>' : '') + '</span>';
    out.appendChild(row);
  }

  // ---- driving the page under test ----
  function $(id) { return doc.getElementById(id); }
  function mode(m) { $(m === 'hex' ? 'inHex' : 'inText').click(); }
  function type(v) {
    var t = $('msg');
    t.value = v;
    t.dispatchEvent(new win.Event('input'));
  }
  function reset() { mode('text'); type(''); }
  function bytes() { return $('byteCount').textContent; }
  function hex() { return $('hexOut').textContent; }
  function warnHex() { return !$('hexHint').hidden; }
  function warnB64() { return !$('b64Hint').hidden; }
  function cmd() { return doc.querySelector('#cmd1 .cmd-text').textContent; }

  var HASH = 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855';
  var ANCHOR = 'kDyEkR4EJG0KWNQWEBNoWKS32wV9mPwe0+iTOheUQr27yxbJI9mF5nlSa2qafVtCNlrdNiztDIIm' +
               'ePA5Rqs3CSZRi1P2kojjtbim3bSWU6YpmFMaPO0oAUs0MUAEkhNz/pHjgRnxyXxFGH4On5xvTQVE' +
               'Dqq7i2SwtrZTCJsdgfIPHw245aughLHo32Kqcuz9RvWSrHc1st+zXMB+z4V2dbHSWwS3TxGRwxep' +
               'l8vpHHQ31QGupVvKm3U949fRXjxHQXXXup5mViPx6kNxqT0zEiffBlz3slLCPgHVAfQMmy/O3XnB' +
               'djuwk3mr+jRGGSb03Wlkhlevx8RmYosWdBgrGK4bJXIPQOqE5pHCRQhmi/StqP14doAFCAxi+Hn8' +
               'vsPOovT/zeAj9ip+WGNQ+KjICYQuCPefeGtvsZ6vvhN4Ch4Z1T6DFm021vUg+60/U7S0TovcPkVb' +
               'vUz6aLYNFgVPoSJTJqGP1mESywwn8CmDKuNmUEv9om3sI63tRkADe8uGnzLpN3fKj7SCPqTEu+lr' +
               'Jp+E6cz9oTeXrpMc6tv+D3UZoa8LqcwXRy8=';

  function run() {
    group('Text encoding');
    reset();
    type('gm');
    is('"gm" is 2 bytes', bytes(), '2 bytes');
    is('"gm" encodes to 676d', hex(), '676d');
    type('\u{1F44D}');
    is('a plain emoji costs 4 bytes', bytes(), '4 bytes');
    type('\u{1F44D}\u{1F3FB}');
    is('a skin-toned emoji costs 8 bytes', bytes(), '8 bytes');
    type('café');
    is('an accented letter costs 2 bytes', bytes(), '5 bytes');

    group('Hex input');
    reset(); mode('hex');
    type('deadbeef');
    is('hex is taken as given', hex(), 'deadbeef');
    is('4 hex bytes counted', bytes(), '4 bytes');
    type('0x DE AD BE EF');
    is('0x, spacing and case are normalised', hex(), 'deadbeef');
    type(HASH);
    is('a 32-byte hash counts as 32 bytes', bytes(), '32 bytes');
    type('abc');
    is('odd length is rejected', bytes(), 'invalid');
    ok('odd length says why', $('byteNote').textContent.indexOf('Odd') === 0);
    ok('invalid input never reaches the command', cmd().indexOf('your-hex-appears-here') > -1);
    type('zzz!!!');
    is('non-hex is rejected', bytes(), 'invalid');

    group('Base64 case sensitivity');
    // Both decode cleanly and differ. Lowercasing before detection would
    // corrupt the payload with no error anywhere.
    reset(); mode('hex');
    type('SGVsbG8=');
    ok('uppercase base64 is detected', warnB64());
    $('convB64').click();
    is('SGVsbG8= converts to 48656c6c6f', hex(), '48656c6c6f');
    reset(); mode('hex');
    type('sgvsbg8=');
    $('convB64').click();
    is('sgvsbg8= converts to b20bec6e0f', hex(), 'b20bec6e0f');
    ok('the two cases give different bytes', '48656c6c6f' !== 'b20bec6e0f');

    group('Hex pasted into the text field');
    reset();
    type(HASH);
    is('hex as text double-encodes to 64 bytes', bytes(), '64 bytes');
    ok('and is flagged', warnHex());
    $('toHexMode').click();
    is('switching fixes it to 32 bytes', bytes(), '32 bytes');
    is('and the bytes are the hash itself', hex(), HASH);

    group('Base64 pasted into the text field');
    reset();
    type(ANCHOR);
    is('base64 as text is 568 bytes', bytes(), '568 bytes');
    ok('and is flagged', warnB64());
    $('convB64').click();
    is('converting gives the real 425 bytes', bytes(), '425 bytes');
    ok('command carries the converted payload', cmd().indexOf('903c84911e04') > -1);

    group('No false positives on ordinary text');
    reset();
    [['a sentence', 'This is a perfectly ordinary message I would like to write to the blockchain'],
     ['punctuation', 'Hello, world! This is a test of the emergency broadcast system, stand by.'],
     ['a URL', 'https://seqrets.github.io/op_return/index.html?something=value&more=stuff'],
     ['one long unbroken word', 'Supercalifragilisticexpialidociousandthensomemorewordsjustkeepgoingonandon'],
     ['64 chars of joined words', 'Thequickbrownfoxjumpsoverthelazydogandthenrunsawayveryfastyes'],
     ['an emoji message', 'gm bitcoin \u{1F44D}\u{1F3FB} have a wonderful day everyone out there']
    ].forEach(function (c) {
      type(c[1]);
      ok(c[0] + ' is not flagged', !warnHex() && !warnB64());
    });

    group('Trezor size gate');
    reset();
    type('x'.repeat(80));
    ok('exactly 80 bytes is allowed', !$('pickTrezor').classList.contains('is-disabled'));
    type('x'.repeat(81));
    ok('81 bytes disables the card', $('pickTrezor').classList.contains('is-disabled'));
    is('and marks it for assistive tech', $('pickTrezor').getAttribute('aria-disabled'), 'true');
    ok('steps are hidden', $('trezorSteps').hidden);
    ok('a way out is offered', !$('trezorBlocked').hidden);
    $('pickCore').click();
    $('pickTrezor').click();
    is('the disabled card ignores clicks', $('pickTrezor').getAttribute('aria-pressed'), 'false');
    type('short');
    ok('going back under restores it', !$('pickTrezor').classList.contains('is-disabled'));
    reset(); mode('hex'); type(HASH);
    ok('a 32-byte hash keeps Trezor available', !$('pickTrezor').classList.contains('is-disabled'));

    group('Commands');
    reset(); mode('hex'); type('deadbeef');
    ok('console form has no bitcoin-cli prefix', cmd().indexOf('bitcoin-cli') === -1);
    $('modeTerminal').click();
    ok('terminal form adds bitcoin-cli', cmd().indexOf('bitcoin-cli') === 0);
    ok('terminal form quotes the JSON', cmd().indexOf("'[]'") > -1);
    $('modeConsole').click();
    ok('payload appears beside the command', $('payloadBytes').textContent === '4 bytes');

    group('Promises the README makes');
    is('light is the default theme', win.getComputedStyle(doc.body).backgroundColor, 'rgb(242, 236, 224)');
    is('the page makes no network requests', win.performance.getEntriesByType('resource').length, 0);
    ok('no em dashes in the copy', !/[–—]/.test(doc.body.innerText));
    reset();
  }

  var frame = document.getElementById('app');
  frame.addEventListener('load', function () {
    try {
      doc = frame.contentDocument;
      win = frame.contentWindow;
      if (!doc || !doc.getElementById('msg')) throw new Error('frame not readable');
    } catch (e) {
      summary.className = 'fail';
      summary.textContent = 'Cannot read the page under test. Serve this over http, for example: python3 -m http.server 8000';
      return;
    }
    try {
      run();
    } catch (e) {
      record(false, 'the suite itself threw', String(e && e.message || e));
    }
    summary.className = fail ? 'fail' : 'pass';
    summary.textContent = fail
      ? fail + ' failed, ' + pass + ' passed'
      : 'all ' + pass + ' passed';
  });

  // Set last, and uncached: loading a stale index.html would let the suite
  // pass against code that is not the code on disk.
  frame.src = 'index.html?t=' + Date.now();
})();
</script>
</body>
</html>
